<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <title>Задание 1</title>
    <style>
        /* Немного магии CSS, чтобы было красиво */
        body {
            font-family: Arial, sans-serif;
            background-color: #f9f9f9;
            color: #333;
            max-width: 700px;
            margin: 20px auto;
            padding: 20px;
            background: white;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            border-radius: 8px;
        }
        h2 {
            border-bottom: 2px solid #ddd;
            padding-bottom: 5px;
        }
        /* Отступы для каждого поля формы */
        form p {
            margin-bottom: 15px;
        }
        /* Стили для полей ввода */
        input[type="text"],
        input[type="tel"],
        input[type="email"],
        input[type="date"],
        textarea,
        select {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box; /* Чтобы padding не ломал ширину */
        }
        /* Радиокнопки и чекбоксы не должны растягиваться на всю ширину */
        input[type="radio"],
        input[type="checkbox"] {
            width: auto;
            margin-right: 5px;
        }
        /* Стили для fieldset */
        fieldset {
            border: 1px solid #ccc;
            border-radius: 4px;
            padding: 10px 15px;
            margin-bottom: 15px;
        }
        legend {
            font-weight: bold;
            padding: 0 5px;
        }
        /* Кнопка */
        input[type="submit"] {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        input[type="submit"]:hover {
            background-color: #45a049;
        }
        /* Список языков делаем компактнее */
        select[multiple] {
            height: 150px; /* Ограничиваем высоту */
        }
    </style>
</head>
<body>

<h2>Формы:</h2>

<form action="" method="get">
    <p>
        <label for="name">Ваше ФИО:</label>
        <input id="name" name="name" type="text" required
               pattern="[A-Za-zА-Яа-яЁё\s\-']+"
               title="ФИО может содержать только буквы, пробелы и дефис. Цифры запрещены.">
    </p>

    <p>
        <label for="phone">Ваш номер телефона:</label>
        <input id="phone" name="phone" type="tel" required
               pattern="\+?[0-9\s\-\(\)]+"
               title="Номер телефона может содержать только цифры, пробелы, скобки, дефис и знак +. Буквы запрещены.">
    </p>

    <p>
        <label for="email">Ваша электронная почта:</label>
        <input id="email" name="email" type="email" required>
    </p>

    <p>
        <label for="birthday">Ваша дата рождения:</label>
        <input id="birthday" name="birthday" type="date" required>
    </p>

    <fieldset>
        <legend>Ваш пол:</legend>
        <input type="radio" name="gender" id="male" value="male" required>
        <label for="male">Мужской</label>
        <input type="radio" name="gender" id="female" value="female">
        <label for="female">Женский</label>
    </fieldset>

    <p>
        <label for="languages">Ваш любимый язык программирования:</label>
        <select name="languages[]" id="languages" multiple>
            <option value="Pascal">Pascal</option>
            <option value="C">C</option>
            <option value="C++">C++</option>
            <option value="JavaScript">JavaScript</option>
            <option value="PHP">PHP<

            <option value="Scala">Scala</option>

    </p>

    <p>
        <label for="bio">Биография:</label>
