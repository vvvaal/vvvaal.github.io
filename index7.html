<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Галерея — Задание 7</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #1a1d24;
            color: #eaeaea;
            padding: 24px 16px;
        }

        .gallery {
            width: 100%;
            max-width: 960px;
            text-align: center;
        }

        .gallery__title {
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 16px;
            letter-spacing: 0.5px;
        }

        .carousel {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .carousel__viewport {
            flex: 1 1 auto;
            overflow: hidden;
            border-radius: 12px;
        }

        .carousel__track {
            display: flex;
            transition: transform 0.4s ease;
            will-change: transform;
        }

        .slide {
            flex: 0 0 33.3333%;
            padding: 0 4px;
        }

        .slide img {
            display: block;
            width: 100%;
            aspect-ratio: 4 / 3;
            object-fit: cover;
            border-radius: 8px;
            background: #111418;
        }

        .carousel__btn {
            flex: 0 0 auto;
            width: 42px;
            height: 42px;
            border: none;
            border-radius: 50%;
            background: #2b6cb0;
            color: #fff;
            font-size: 18px;
            line-height: 1;
            cursor: pointer;
            transition: background 0.2s, transform 0.15s;
            box-shadow: 0 4px 12px rgba(43, 108, 176, 0.4);
        }

        .carousel__btn:hover {
            background: #3a86d1;
        }

        .carousel__btn:active {
            transform: scale(0.92);
        }

        .carousel__btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .pager {
            margin-top: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .pager__dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            border: none;
            padding: 0;
            background: #3a3f4b;
            cursor: pointer;
            transition: background 0.2s, transform 0.2s;
        }

        .pager__dot.is-active {
            background: #2b6cb0;
            transform: scale(1.4);
        }

        .pager__counter {
            margin-top: 8px;
            font-size: 13px;
            color: #9aa3b2;
        }

        .pager__counter strong {
            color: #fff;
        }

        @media (max-width: 640px) {
            .gallery {
                max-width: 100%;
            }

            .slide {
                flex-basis: 100%;
            }

            .carousel__btn {
                width: 36px;
                height: 36px;
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <main class="gallery">
        <h1 class="gallery__title">Галерея</h1>

        <div class="carousel">
            <button class="carousel__btn carousel__btn--prev" type="button" aria-label="Предыдущая страница">&#10094;</button>

            <div class="carousel__viewport">
                <div class="carousel__track" id="track">
                    <figure class="slide"><img src="https://picsum.photos/id/1015/800/600" alt="Горное озеро" loading="lazy"></figure>
                    <figure class="slide"><img src="https://picsum.photos/id/1016/800/600" alt="Горная река" loading="lazy"></figure>
                    <figure class="slide"><img src="https://picsum.photos/id/1018/800/600" alt="Водопад" loading="lazy"></figure>
                    <figure class="slide"><img src="https://picsum.photos/id/1019/800/600" alt="Лес" loading="lazy"></figure>
                    <figure class="slide"><img src="https://picsum.photos/id/1020/800/600" alt="Пляж" loading="lazy"></figure>
                    <figure class="slide"><img src="https://picsum.photos/id/1021/800/600" alt="Дюны" loading="lazy"></figure>
                    <figure class="slide"><img src="https://picsum.photos/id/1022/800/600" alt="Пустыня" loading="lazy"></figure>
                    <figure class="slide"><img src="https://picsum.photos/id/1023/800/600" alt="Скалы" loading="lazy"></figure>
                </div>
            </div>

            <button class="carousel__btn carousel__btn--next" type="button" aria-label="Следующая страница">&#10095;</button>
        </div>

        <div class="pager" id="pager" aria-label="Навигация по страницам"></div>

        <div class="pager__counter" aria-live="polite">
            Страница <strong id="pagerCurrent">1</strong> из <span id="pagerTotal">1</span>
        </div>
    </main>

    <script>
        (function () {
            "use strict";

            var track = document.getElementById("track");
            var prevBtn = document.querySelector(".carousel__btn--prev");
            var nextBtn = document.querySelector(".carousel__btn--next");
            var pager = document.getElementById("pager");
            var pagerCurrent = document.getElementById("pagerCurrent");
            var pagerTotal = document.getElementById("pagerTotal");

            var slides = Array.prototype.slice.call(track.children);
            var totalSlides = slides.length;
            var currentPage = 0;
            var perView = 3;
            var pages = 1;
            var dots = [];

            function getPerView() {
                return window.matchMedia("(max-width: 640px)").matches ? 1 : 3;
            }

            function calcPages() {
                return Math.max(1, Math.ceil(totalSlides / perView));
            }

            function buildPager() {
                var i;
                pager.innerHTML = "";
                dots = [];
                for (i = 0; i < pages; i += 1) {
                    (function (index) {
                        var dot = document.createElement("button");
                        dot.type = "button";
                        dot.className = "pager__dot";
                        dot.setAttribute("aria-label", "Перейти к странице " + (index + 1));
                        dot.addEventListener("click", function () {
                            goTo(index);
                        });
                        pager.appendChild(dot);
                        dots.push(dot);
                    }(i));
                }
                pagerTotal.textContent = String(pages);
            }

            function render() {
                var maxPage = pages - 1;
                var offset;
                var i;

                if (currentPage > maxPage) {
                    currentPage = maxPage;
                }
                if (currentPage < 0) {
                    currentPage = 0;
                }

                offset = currentPage * perView * 100;
                track.style.transform = "translateX(-" + offset + "%)";

                for (i = 0; i < dots.length; i += 1) {
                    dots[i].classList.toggle("is-active", i === currentPage);
                }

                pagerCurrent.textContent = String(currentPage + 1);
                prevBtn.disabled = currentPage === 0;
                nextBtn.disabled = currentPage === maxPage;
            }

            function goTo(page) {
                currentPage = page;
                render();
            }

            function goPrev() {
                goTo(currentPage - 1);
            }

            function goNext() {
                goTo(currentPage + 1);
            }

            function recalc() {
                perView = getPerView();
                pages = calcPages();
                buildPager();
                render();
            }

            prevBtn.addEventListener("click", goPrev);
            nextBtn.addEventListener("click", goNext);

            document.addEventListener("keydown", function (event) {
                if (event.key === "ArrowLeft") {
                    goPrev();
                } else if (event.key === "ArrowRight") {
                    goNext();
                }
            });

            var startX = 0;
            var isTouching = false;

            track.addEventListener("touchstart", function (event) {
                startX = event.touches[0].clientX;
                isTouching = true;
            }, { passive: true });

            track.addEventListener("touchend", function (event) {
                var endX;
                var diff;
                if (!isTouching) {
                    return;
                }
                isTouching = false;
                endX = event.changedTouches[0].clientX;
                diff = endX - startX;
                if (Math.abs(diff) > 40) {
                    if (diff < 0) {
                        goNext();
                    } else {
                        goPrev();
                    }
                }
            });

            window.addEventListener("resize", recalc);

            recalc();
        }());
    </script>
</body>
</html>
