<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Галерея</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #edf2f7;
            padding: 24px 16px;
        }

        .gallery {
            background: #ffffff;
            border-radius: 16px;
            padding: 32px 24px;
            width: 100%;
            max-width: 1000px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .gallery__title {
            font-size: 24px;
            font-weight: 600;
            color: #1a365d;
            margin-bottom: 24px;
        }

        .carousel {
            display: flex;
            align-items: center;
            width: 100%;
            gap: 20px;
        }

        .carousel__viewport {
            flex: 1 1 auto;
            overflow: hidden;
            border-radius: 12px;
        }

        .carousel__track {
            display: flex;
            transition: transform 0.4s ease-in-out;
            will-change: transform;
        }

        .slide {
            flex: 0 0 33.3333%;
            padding: 0 10px;
            display: flex;
            justify-content: center;
        }

        .slide img {
            display: block;
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            border-radius: 12px;
            background: #e2e8f0;
        }

        .carousel__btn {
            flex: 0 0 auto;
            width: 44px;
            height: 44px;
            border: none;
            border-radius: 50%;
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.2s, background 0.2s;
        }

        .carousel__btn--prev {
            background: #b9cde4;
        }

        .carousel__btn--next {
            background: #3b82f6;
        }

        .carousel__btn:hover {
            opacity: 0.8;
        }

        .carousel__btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .pager {
            margin-top: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .pager__dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            border: none;
            padding: 0;
            background: #b9cde4;
            cursor: pointer;
            transition: background 0.2s;
        }

        .pager__dot.is-active {
            background: #3b82f6;
        }

        @media (max-width: 768px) {
            .gallery {
                padding: 24px 16px;
            }

            .gallery__title {
                font-size: 20px;
                margin-bottom: 16px;
            }

            .slide {
                flex-basis: 100%;
                padding: 0 5px;
            }

            .carousel {
                gap: 10px;
            }

            .carousel__btn {
                width: 36px;
                height: 36px;
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <main class="gallery">
        <h1 class="gallery__title">Галерея</h1>

        <div class="carousel">
            <button class="carousel__btn carousel__btn--prev" type="button" aria-label="Предыдущая страница">&#8592;</button>

            <div class="carousel__viewport">
                <div class="carousel__track" id="track">
                    <!-- Ваши локальные картинки -->
                    <figure class="slide"><img src="img1.jpg" alt="Изображение 1"></figure>
                    <figure class="slide"><img src="img2.jpg" alt="Изображение 2"></figure>
                    <figure class="slide"><img src="img3.jpg" alt="Изображение 3"></figure>
                    <figure class="slide"><img src="img4.jpg" alt="Изображение 4"></figure>
                    <figure class="slide"><img src="img5.jpg" alt="Изображение 5"></figure>
                    <figure class="slide"><img src="img6.jpg" alt="Изображение 6"></figure>
                    <figure class="slide"><img src="img7.jpg" alt="Изображение 7"></figure>
                    <figure class="slide"><img src="img8.jpg" alt="Изображение 8"></figure>
                </div>
            </div>

            <button class="carousel__btn carousel__btn--next" type="button" aria-label="Следующая страница">&#8594;</button>
        </div>

        <div class="pager" id="pager" aria-label="Навигация по страницам"></div>
    </main>

    <script>
        (function () {
            "use strict";

            var track = document.getElementById("track");
            var prevBtn = document.querySelector(".carousel__btn--prev");
            var nextBtn = document.querySelector(".carousel__btn--next");
            var pager = document.getElementById("pager");

            var slides = Array.prototype.slice.call(track.children);
            var totalSlides = slides.length;
            var currentPage = 0;
            var perView = 3;
            var pages = 1;
            var dots = [];

            function getPerView() {
                return window.matchMedia("(max-width: 768px)").matches ? 1 : 3;
            }

            function calcPages() {
                return Math.max(1, Math.ceil(totalSlides / perView));
            }

            function buildPager() {
                var i;
                pager.innerHTML = "";
                dots = [];
                for (i = 0; i < pages; i += 1) {
                    (function (index) {
                        var dot = document.createElement("button");
                        dot.type = "button";
                        dot.className = "pager__dot";
                        dot.setAttribute("aria-label", "Перейти к странице " + (index + 1));
                        dot.addEventListener("click", function () {
                            goTo(index);
                        });
                        pager.appendChild(dot);
                        dots.push(dot);
                    }(i));
                }
            }

            function render() {
                var maxPage = pages - 1;
                var offset;
                var i;

                if (currentPage > maxPage) {
                    currentPage = maxPage;
                }
                if (currentPage < 0) {
                    currentPage = 0;
                }

                offset = currentPage * perView * (100 / totalSlides);
                track.style.transform = "translateX(-" + offset + "%)";

                for (i = 0; i < dots.length; i += 1) {
                    dots[i].classList.toggle("is-active", i === currentPage);
                }

                prevBtn.disabled = currentPage === 0;
                nextBtn.disabled = currentPage === maxPage;
            }

            function goTo(page) {
                currentPage = page;
                render();
            }

            function goPrev() {
                goTo(currentPage - 1);
            }

            function goNext() {
                goTo(currentPage + 1);
            }

            function recalc() {
                perView = getPerView();
                pages = calcPages();
                buildPager();
                render();
            }

            prevBtn.addEventListener("click", goPrev);
            nextBtn.addEventListener("click", goNext);

            document.addEventListener("keydown", function (event) {
                if (event.key === "ArrowLeft") {
                    goPrev();
                } else if (event.key === "ArrowRight") {
                    goNext();
                }
            });

            var startX = 0;
            var isTouching = false;

            track.addEventListener("touchstart", function (event) {
                startX = event.touches[0].clientX;
                isTouching = true;
            }, { passive: true });

            track.addEventListener("touchend", function (event) {
                var endX;
                var diff;
                if (!isTouching) {
                    return;
                }
                isTouching = false;
                endX = event.changedTouches[0].clientX;
                diff = endX - startX;
                if (Math.abs(diff) > 40) {
                    if (diff < 0) {
                        goNext();
                    } else {
                        goPrev();
                    }
                }
            });

            window.addEventListener("resize", recalc);

            recalc();
        }());
    </script>
</body>
</html>
