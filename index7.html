<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Галерея</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #edf2f7;
            padding: 24px 16px;
            /* Убираем горизонтальный скролл на мобильных */
            overflow-x: hidden; 
        }

        .gallery {
            background: #ffffff;
            border-radius: 16px;
            padding: 32px 24px;
            width: 100%;
            max-width: 1000px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .gallery__title {
            font-size: 24px;
            font-weight: 600;
            color: #1a365d;
            margin-bottom: 24px;
        }

        .carousel {
            display: flex;
            align-items: center;
            width: 100%;
            gap: 20px;
        }

        .carousel__viewport {
            flex: 1 1 auto;
            overflow: hidden;
            border-radius: 12px;
        }

        .carousel__track {
            display: flex;
            will-change: transform;
        }

        .carousel__track.is-animated {
            transition: transform 0.4s ease-in-out;
        }

        .slide {
            flex: 0 0 33.3333%;
            padding: 0 10px;
            display: flex;
            justify-content: center;
        }

        .slide img {
            display: block;
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            border-radius: 12px;
            background: #e2e8f0;
            pointer-events: none; /* Защита от перетаскивания картинки мышкой */
        }

        .carousel__btn {
            flex: 0 0 auto;
            width: 44px;
            height: 44px;
            border: none;
            border-radius: 50%;
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.2s, background 0.2s;
        }

        .carousel__btn--prev {
            background: #b9cde4;
        }

        .carousel__btn--next {
            background: #3b82f6;
        }

        .carousel__btn:hover {
            opacity: 0.8;
        }

        .pager {
            margin-top: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .pager__dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            border: none;
            padding: 0;
            background: #b9cde4;
            cursor: pointer;
            transition: background 0.2s;
        }

        .pager__dot.is-active {
            background: #3b82f6;
        }

        /* Мобильная версия: 1 фотография */
        @media (max-width: 768px) {
            .gallery {
                padding: 24px 16px;
            }

            .gallery__title {
                font-size: 20px;
                margin-bottom: 16px;
            }

            .slide {
                flex-basis: 100%;
                padding: 0 5px;
            }

            .carousel {
                gap: 10px;
            }

            .carousel__btn {
                width: 36px;
                height: 36px;
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <main class="gallery">
        <h1 class="gallery__title">Галерея</h1>

        <div class="carousel">
            <button class="carousel__btn carousel__btn--prev" type="button" aria-label="Предыдущая страница">&#8592;</button>

            <div class="carousel__viewport">
                <!-- Оригинальные слайды -->
                <div class="carousel__track" id="track">
                    <figure class="slide"><img src="img1.jpg" alt="Изображение 1"></figure>
                    <figure class="slide"><img src="img2.jpg" alt="Изображение 2"></figure>
                    <figure class="slide"><img src="img3.jpg" alt="Изображение 3"></figure>
                    <figure class="slide"><img src="img4.jpg" alt="Изображение 4"></figure>
                    <figure class="slide"><img src="img5.jpg" alt="Изображение 5"></figure>
                    <figure class="slide"><img src="img6.jpg" alt="Изображение 6"></figure>
                    <figure class="slide"><img src="img7.jpg" alt="Изображение 7"></figure>
                    <figure class="slide"><img src="img8.jpg" alt="Изображение 8"></figure>
                </div>
            </div>

            <button class="carousel__btn carousel__btn--next" type="button" aria-label="Следующая страница">&#8594;</button>
        </div>

        <div class="pager" id="pager" aria-label="Навигация по страницам"></div>
    </main>

    <script>
        (function () {
            "use strict";

            var track = document.getElementById("track");
            var prevBtn = document.querySelector(".carousel__btn--prev");
            var nextBtn = document.querySelector(".carousel__btn--next");
            var pager = document.getElementById("pager");

            var originalSlides = Array.prototype.slice.call(track.children);
            var totalOriginal = originalSlides.length;
            
            var perView = 3;
            var currentIndex = 0;
            var realIndex = 0;
            var pages = 1;
            var dots = [];
            var isAnimating = false;

            function getPerView() {
                return window.matchMedia("(max-width: 768px)").matches ? 1 : 3;
            }

            function setupClones() {
                // Очищаем трек от старых клонов (при ресайзе)
                track.innerHTML = "";
                originalSlides.forEach(function(slide) {
                    track.appendChild(slide);
                });

                // Клонируем последние элементы и ставим в начало
                for (var i = totalOriginal - perView; i < totalOriginal; i++) {
                    var clone = originalSlides[i].cloneNode(true);
                    clone.classList.add("is-clone");
                    track.insertBefore(clone, track.firstChild);
                }

                // Клонируем первые элементы и ставим в конец
                for (var j = 0; j < perView; j++) {
                    var clone = originalSlides[j].cloneNode(true);
                    clone.classList.add("is-clone");
                    track.appendChild(clone);
                }
            }

            function calcPages() {
                return Math.ceil(totalOriginal / perView);
            }

            function buildPager() {
                pager.innerHTML = "";
                dots = [];
                for (var i = 0; i < pages; i += 1) {
                    (function (index) {
                        var dot = document.createElement("button");
                        dot.type = "button";
                        dot.className = "pager__dot";
                        dot.setAttribute("aria-label", "Перейти к странице " + (index + 1));
                        dot.addEventListener("click", function () {
                            goToPage(index);
                        });
                        pager.appendChild(dot);
                        dots.push(dot);
                    }(i));
                }
            }

            function updatePager() {
                // Вычисляем, какая страница сейчас активна
                var pageIndex = Math.floor(realIndex / perView);
                if (pageIndex >= pages) pageIndex = pages - 1;

                for (var i = 0; i < dots.length; i += 1) {
                    dots[i].classList.toggle("is-active", i === pageIndex);
                }
            }

            function setTransform(animate) {
                if (animate) {
                    track.classList.add("is-animated");
                } else {
                    track.classList.remove("is-animated");
                }
                
                // Сдвигаем на (текущий индекс + количество клонов в начале) * ширину слайда
                var offset = (currentIndex + perView) * (100 / (totalOriginal + perView * 2));
                track.style.transform = "translateX(-" + offset + "%)";
            }

            function goNext() {
                if (isAnimating) return;
                isAnimating = true;
                currentIndex += 1;
                realIndex = (realIndex + 1) % totalOriginal;
                setTransform(true);
                updatePager();
            }

            function goPrev() {
                if (isAnimating) return;
                isAnimating = true;
                currentIndex -= 1;
                realIndex = (realIndex - 1 + totalOriginal) % totalOriginal;
                setTransform(true);
                updatePager();
            }

            function goToPage(page) {
                if (isAnimating) return;
                var targetIndex = page * perView;
                if (targetIndex >= totalOriginal) targetIndex = totalOriginal - 1;
                
                // Прыгаем напрямую без эффектов для точек пагинации
                currentIndex = targetIndex;
                realIndex = targetIndex;
                setTransform(true);
                updatePager();
            }

            // Обработка окончания анимации для зацикливания
            track.addEventListener("transitionend", function () {
                isAnimating = false;

                // Если мы ушли далеко вправо (в клоны)
                if (currentIndex >= totalOriginal) {
                    currentIndex = currentIndex - totalOriginal;
                    setTransform(false);
                    // Принудительный рефлоу для применения стилей без анимации
                    void track.offsetWidth; 
                }
                
                // Если мы ушли далеко влево (в клоны)
                if (currentIndex < 0) {
                    currentIndex = currentIndex + totalOriginal;
                    setTransform(false);
                    void track.offsetWidth;
                }
            });

            function recalc() {
                isAnimating = false;
                perView = getPerView();
                pages = calcPages();
                
                // При смене разрешения сбрасываем позицию на начало
                currentIndex = 0;
                realIndex = 0;
                
                setupClones();
                buildPager();
                setTransform(false);
                updatePager();
            }

            prevBtn.addEventListener("click", goPrev);
            nextBtn.addEventListener("click", goNext);

            document.addEventListener("keydown", function (event) {
                if (event.key === "ArrowLeft") goPrev();
                if (event.key === "ArrowRight") goNext();
            });

            // Свайпы
            var startX = 0;
            var isTouching = false;

            track.addEventListener("touchstart", function (event) {
                startX = event.touches[0].clientX;
                isTouching = true;
            }, { passive: true });

            track.addEventListener("touchend", function (event) {
                if (!isTouching) return;
                isTouching = false;
                var endX = event.changedTouches[0].clientX;
                var diff = endX - startX;
                if (Math.abs(diff) > 40) {
                    if (diff < 0) goNext();
                    else goPrev();
                }
            });

            window.addEventListener("resize", recalc);

            // Запуск
            recalc();
        }());
    </script>
</body>
</html>
