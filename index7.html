<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Карусель — Задание 7</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #1a1d24;
            color: #eaeaea;
            padding: 24px 16px;
        }

        .gallery {
            width: 100%;
            max-width: 1100px;
            text-align: center;
        }

        .gallery__title {
            font-size: 26px;
            font-weight: 600;
            margin-bottom: 22px;
            letter-spacing: 0.5px;
        }

        .carousel {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .carousel__viewport {
            position: relative;
            width: 100%;
            height: 520px;
            overflow: hidden;
        }

        .carousel__stage {
            position: relative;
            width: 100%;
            height: 100%;
        }

        .slide {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 88%;
            height: 100%;
            transform: translate(-50%, -50%) scale(0.6);
            opacity: 0;
            transition: transform 0.45s ease, opacity 0.45s ease, filter 0.45s ease;
            cursor: pointer;
            border-radius: 16px;
            overflow: hidden;
            background: #111418;
            box-shadow: 0 14px 40px rgba(0, 0, 0, 0.55);
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Фото целиком, без обрезки */
        .slide img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .slide.is-active {
            transform: translate(-50%, -50%) scale(1);
            opacity: 1;
            z-index: 3;
            filter: none;
            pointer-events: auto;
            cursor: default;
        }

        .slide.is-prev {
            transform: translate(-112%, -50%) scale(0.7);
            opacity: 0.35;
            z-index: 2;
            filter: brightness(0.5);
            pointer-events: auto;
        }

        .slide.is-next {
            transform: translate(12%, -50%) scale(0.7);
            opacity: 0.35;
            z-index: 2;
            filter: brightness(0.5);
            pointer-events: auto;
        }

        .carousel__btn {
            flex: 0 0 auto;
            width: 52px;
            height: 52px;
            border: none;
            border-radius: 50%;
            background: #2b6cb0;
            color: #fff;
            font-size: 22px;
            line-height: 1;
            cursor: pointer;
            transition: background 0.2s, transform 0.15s;
            z-index: 10;
            box-shadow: 0 6px 18px rgba(43, 108, 176, 0.4);
        }

        .carousel__btn:hover {
            background: #3a86d1;
        }

        .carousel__btn:active {
            transform: scale(0.92);
        }

        .pager {
            margin-top: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .pager__dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            border: none;
            padding: 0;
            background: #3a3f4b;
            cursor: pointer;
            transition: background 0.2s, transform 0.2s;
        }

        .pager__dot.is-active {
            background: #2b6cb0;
            transform: scale(1.4);
        }

        .pager__counter {
            margin-top: 10px;
            font-size: 15px;
            color: #9aa3b2;
        }

        .pager__counter strong {
            color: #fff;
        }

        @media (max-width: 640px) {
            .carousel__viewport {
                height: 380px;
            }

            .slide {
                width: 94%;
            }

            .slide.is-prev,
            .slide.is-next {
                opacity: 0;
                pointer-events: none;
            }

            .carousel__btn {
                width: 44px;
                height: 44px;
                font-size: 18px;
            }
        }
    </style>
</head>
<body>
    <main class="gallery">
        <h1 class="gallery__title">Карусель</h1>

        <div class="carousel">
            <button class="carousel__btn carousel__btn--prev" type="button" aria-label="Предыдущее изображение">&#10094;</button>

            <div class="carousel__viewport">
                <div class="carousel__stage" id="stage">
                    <figure class="slide"><img src="images/img1.jpg.jpg" alt="Изображение 1" width="1200" height="800"></figure>
                    <figure class="slide"><img src="images/img2.jpg" alt="Изображение 2" width="1200" height="800"></figure>
                    <figure class="slide"><img src="images/img3.jpg" alt="Изображение 3" width="1200" height="800"></figure>
                    <figure class="slide"><img src="images/img4.jpg" alt="Изображение 4" width="1200" height="800"></figure>
                    <figure class="slide"><img src="images/img5.jpg" alt="Изображение 5" width="1200" height="800"></figure>
                    <figure class="slide"><img src="images/img6.jpg" alt="Изображение 6" width="1200" height="800"></figure>
                    <figure class="slide"><img src="images/img7.jpg" alt="Изображение 7" width="1200" height="800"></figure>
                    <figure class="slide"><img src="images/img8.jpg" alt="Изображение 8" width="1200" height="800"></figure>
                </div>
            </div>

            <button class="carousel__btn carousel__btn--next" type="button" aria-label="Следующее изображение">&#10095;</button>
        </div>

        <div class="pager" id="pager" aria-label="Навигация по слайдам"></div>

        <div class="pager__counter" aria-live="polite">
            <strong id="pagerCurrent">1</strong> / <span id="pagerTotal">8</span>
        </div>
    </main>

    <script>
        (function () {
            "use strict";

            var stage = document.getElementById("stage");
            var prevBtn = document.querySelector(".carousel__btn--prev");
            var nextBtn = document.querySelector(".carousel__btn--next");
            var pager = document.getElementById("pager");
            var pagerCurrent = document.getElementById("pagerCurrent");
            var pagerTotal = document.getElementById("pagerTotal");

            var slides = Array.prototype.slice.call(stage.querySelectorAll(".slide"));
            var total = slides.length;
            var current = 0;
            var dots = [];

            pagerTotal.textContent = String(total);

            slides.forEach(function (_, i) {
                var dot = document.createElement("button");
                dot.type = "button";
                dot.className = "pager__dot";
                dot.setAttribute("aria-label", "Перейти к изображению " + (i + 1));
                dot.addEventListener("click", function () {
                    goTo(i);
                });
                pager.appendChild(dot);
                dots.push(dot);
            });

            function wrap(index) {
                return (index + total) % total;
            }

            function render() {
                var prevIndex = wrap(current - 1);
                var nextIndex = wrap(current + 1);

                slides.forEach(function (slide, i) {
                    slide.classList.remove("is-active", "is-prev", "is-next");
                    if (i === current) {
                        slide.classList.add("is-active");
                    } else if (i === prevIndex) {
                        slide.classList.add("is-prev");
                    } else if (i === nextIndex) {
                        slide.classList.add("is-next");
                    }
                });

                dots.forEach(function (dot, i) {
                    dot.classList.toggle("is-active", i === current);
                });

                pagerCurrent.textContent = String(current + 1);
            }

            function goTo(index) {
                current = wrap(index);
                render();
            }

            function goPrev() {
                goTo(current - 1);
            }

            function goNext() {
                goTo(current + 1);
            }

            prevBtn.addEventListener("click", goPrev);
            nextBtn.addEventListener("click", goNext);

            slides.forEach(function (slide, i) {
                slide.addEventListener("click", function () {
                    if (i !== current) {
                        goTo(i);
                    }
                });
            });

            document.addEventListener("keydown", function (event) {
                if (event.key === "ArrowLeft") {
                    goPrev();
                } else if (event.key === "ArrowRight") {
                    goNext();
                }
            });

            var startX = 0;
            var isTouching = false;

            stage.addEventListener("touchstart", function (event) {
                startX = event.touches[0].clientX;
                isTouching = true;
            }, { passive: true });

            stage.addEventListener("touchend", function (event) {
                if (!isTouching) {
                    return;
                }
                isTouching = false;
                var endX = event.changedTouches[0].clientX;
                var diff = endX - startX;
                if (Math.abs(diff) > 40) {
                    if (diff < 0) {
                        goNext();
                    } else {
                        goPrev();
                    }
                }
            });

            render();
        }());
    </script>
</body>
</html>
