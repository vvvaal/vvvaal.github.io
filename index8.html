<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Обратная связь</title>
    <style>
        /* Базовые стили */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #f4f4f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Кнопка открытия */
        .open-btn {
            padding: 15px 30px;
            font-size: 18px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: background 0.2s;
        }

        .open-btn:hover {
            background: #0056b3;
        }

        /* Оверлей (затемнение фона) */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .overlay.active {
            display: flex;
        }

        /* Контейнер формы (Попап) */
        .modal {
            background: white;
            padding: 20px;
            border-radius: 12px;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            position: relative;
            /* Ключевое для мобильных: не больше высоты экрана */
            max-height: 100vh;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        /* Закрыть */
        .close-btn {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 28px;
            background: none;
            border: none;
            cursor: pointer;
            color: #666;
            line-height: 1;
        }

        .close-btn:hover {
            color: #000;
        }

        h2 {
            margin-bottom: 15px;
            font-size: 20px;
            text-align: center;
            padding-right: 20px; /* Чтобы не наезжало на крестик */
        }

        /* Поля формы */
        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            margin-bottom: 4px;
            font-size: 14px;
            font-weight: 500;
        }

        .form-group input[type="text"],
        .form-group input[type="email"],
        .form-group input[type="tel"],
        .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        /* Чекбокс */
        .checkbox-group {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            margin-bottom: 15px;
            font-size: 12px;
            line-height: 1.4;
        }

        .checkbox-group input {
            margin-top: 2px;
            width: 16px;
            height: 16px;
            flex-shrink: 0;
        }

        /* Кнопка отправки */
        .submit-btn {
            width: 100%;
            padding: 12px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .submit-btn:disabled {
            background: #6c757d;
            cursor: not-allowed;
        }

        .submit-btn:hover:not(:disabled) {
            background: #218838;
        }

        /* Сообщения */
        .message {
            margin-top: 10px;
            text-align: center;
            font-size: 14px;
            padding: 8px;
            border-radius: 4px;
            display: none;
        }

        .message.success {
            display: block;
            background: #d4edda;
            color: #155724;
        }

        .message.error {
            display: block;
            background: #f8d7da;
            color: #721c24;
        }

        /* Мобильная адаптация */
        @media (max-width: 480px) {
            .modal {
                width: 100%;
                height: 100%;
                max-height: 100vh;
                border-radius: 0;
                padding: 15px;
            }

            h2 {
                margin-top: 10px;
            }
        }
    </style>
</head>
<body>

    <!-- Кнопка для открытия -->
    <button class="open-btn" id="openBtn">Связаться с нами</button>

    <!-- Оверлей и модальное окно -->
    <div class="overlay" id="overlay">
        <div class="modal">
            <button class="close-btn" id="closeBtn" aria-label="Закрыть">&times;</button>
            <h2>Форма обратной связи</h2>

            <form id="feedbackForm" novalidate>
                <div class="form-group">
                    <label for="fullname">ФИО *</label>
                    <input type="text" id="fullname" name="fullname" required placeholder="Иванов Иван Иванович">
                </div>

                <div class="form-group">
                    <label for="email">Email *</label>
                    <input type="email" id="email" name="email" required placeholder="example@mail.ru">
                </div>

                <div class="form-group">
                    <label for="phone">Телефон</label>
                    <input type="tel" id="phone" name="phone" placeholder="+7 (999) 123-45-67">
                </div>

                <div class="form-group">
                    <label for="organization">Организация</label>
                    <input type="text" id="organization" name="organization" placeholder="Название компании">
                </div>

                <div class="form-group">
                    <label for="message">Сообщение *</label>
                    <textarea id="message" name="message" required placeholder="Ваше сообщение..."></textarea>
                </div>

                <div class="checkbox-group">
                    <input type="checkbox" id="consent" name="consent" required>
                    <label for="consent">Я согласен с политикой обработки персональных данных *</label>
                </div>

                <button type="submit" class="submit-btn" id="submitBtn">Отправить</button>
                <div class="message" id="formMessage"></div>
            </form>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            // --- Конфигурация ---
            const FORMCARRY_ENDPOINT = 'https://formcarry.com/s/YOUR_FORM_ID'; // <-- ЗАМЕНИТЕ НА ВАШ ID
            const STORAGE_KEY = 'feedback_form_data';

            // --- Элементы DOM ---
            const openBtn = document.getElementById('openBtn');
            const closeBtn = document.getElementById('closeBtn');
            const overlay = document.getElementById('overlay');
            const form = document.getElementById('feedbackForm');
            const submitBtn = document.getElementById('submitBtn');
            const messageDiv = document.getElementById('formMessage');

            // Поля, которые нужно сохранять
            const fields = ['fullname', 'email', 'phone', 'organization', 'message'];

            // --- Функции History API ---

            function openModal() {
                overlay.classList.add('active');
                // Меняем URL, добавляя хеш, чтобы работала кнопка "Назад"
                if (window.location.hash !== '#contact') {
                    history.pushState({ modal: 'contact' }, '', '#contact');
                }
                restoreFormData();
            }

            function closeModal() {
                overlay.classList.remove('active');
                clearMessage();
                // Если мы закрываем форму кнопкой, нужно убрать хеш
                if (window.location.hash === '#contact') {
                    history.back(); // Это вызовет popstate, который сделает всю грязную работу
                }
            }

            // Обработчик кнопки "Назад" в браузере
            window.addEventListener('popstate', function(event) {
                if (window.location.hash === '#contact') {
                    // Если пользователь нажал "Вперед" и вернулся на #contact
                    openModal();
                } else {
                    // Если хеша нет (или он другой), закрываем
                    overlay.classList.remove('active');
                }
            });

            // Проверка при загрузке страницы (если открыли ссылку сразу с #contact)
            if (window.location.hash === '#contact') {
                // Небольшая задержка, чтобы DOM точно прогрузился
                setTimeout(openModal, 0);
            }

            // --- LocalStorage ---

            function saveFormData() {
                const data = {};
                fields.forEach(function(id) {
                    const el = document.getElementById(id);
                    if (el) data[id] = el.value;
                });
                const consent = document.getElementById('consent');
                if (consent) data.consent = consent.checked;

                localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
            }

            function restoreFormData() {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (!saved) return;

                try {
                    const data = JSON.parse(saved);
                    fields.forEach(function(id) {
                        const el = document.getElementById(id);
                        if (el && data[id] !== undefined) {
                            el.value = data[id];
                        }
                    });
                    const consent = document.getElementById('consent');
                    if (consent && data.consent !== undefined) {
                        consent.checked = data.consent;
                    }
                } catch (e) {
                    console.warn('Ошибка восстановления данных', e);
                }
            }

            function clearFormData() {
                localStorage.removeItem(STORAGE_KEY);
                form.reset();
            }

            // --- Отправка формы ---

            function showMessage(text, type) {
                messageDiv.textContent = text;
                messageDiv.className = 'message ' + type;
            }

            function clearMessage() {
                messageDiv.textContent = '';
                messageDiv.className = 'message';
            }

            form.addEventListener('submit', async function(e) {
                e.preventDefault();

                // Валидация
                if (!form.checkValidity()) {
                    form.reportValidity();
                    return;
                }

                // Блокируем кнопку
                submitBtn.disabled = true;
                submitBtn.textContent = 'Отправка...';
                clearMessage();

                // Сбор данных
                const formData = {
                    fullname: document.getElementById('fullname').value.trim(),
                    email: document.getElementById('email').value.trim(),
                    phone: document.getElementById('phone').value.trim(),
                    organization: document.getElementById('organization').value.trim(),
                    message: document.getElementById('message').value.trim(),
                    consent: document.getElementById('consent').checked
                };

                try {
                    const response = await fetch(FORMCARRY_ENDPOINT, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Accept': 'application/json'
                        },
                        body: JSON.stringify(formData)
                    });

                    const result = await response.json();

                    if (response.ok && result.code === 200) {
                        showMessage('Сообщение успешно отправлено!', 'success');
                        // Очищаем поля и LocalStorage только при успехе
                        clearFormData();
                        // Опционально: закрыть форму через 2 секунды
                        // setTimeout(closeModal, 2000);
                    } else {
                        throw new Error(result.message || 'Ошибка сервера');
                    }
                } catch (error) {
                    console.error('Ошибка отправки:', error);
                    showMessage('Ошибка отправки: ' + error.message, 'error');
                } finally {
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Отправить';
                }
            });

            // --- Слушатели событий ---

            // Сохраняем при вводе (для текстовых полей)
            fields.forEach(function(id) {
                const el = document.getElementById(id);
                if (el) {
                    el.addEventListener('input', saveFormData);
                }
            });
            // Для чекбокса
            document.getElementById('consent').addEventListener('change', saveFormData);

            // Кнопки
            openBtn.addEventListener('click', openModal);
            closeBtn.addEventListener('click', closeModal);
            overlay.addEventListener('click', function(e) {
                if (e.target === overlay) closeModal();
            });

        })();
    </script>
</body>
</html>
