<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Форма обратной связи</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #f4f4f9;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            min-height: 100vh;
        }

        video {
            max-width: 100%;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }

        button#open-modal {
            padding: 15px 30px;
            font-size: 18px;
            background: #007bff;
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: background 0.2s;
        }
        button#open-modal:hover { background: #0056b3; }

        /* Модальное окно */
        .modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 10px;
        }
        .modal.active { display: flex; }

        .modal-content {
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            position: relative;
            max-height: 100vh;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .close-btn {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 24px;
            background: none;
            border: none;
            cursor: pointer;
            color: #666;
            line-height: 1;
        }
        .close-btn:hover { color: #000; }

        h2 {
            margin-bottom: 15px;
            font-size: 20px;
            text-align: center;
            padding-right: 20px;
        }

        form { display: flex; flex-direction: column; }

        input, textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        label {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            margin-bottom: 15px;
            font-size: 12px;
            line-height: 1.4;
            cursor: pointer;
        }

        input[type="checkbox"] {
            margin-top: 2px;
            width: 16px;
            height: 16px;
            flex-shrink: 0;
            margin-bottom: 0;
        }

        button.send {
            width: 100%;
            padding: 12px;
            background: #28a745;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.2s;
            margin-bottom: 10px;
        }
        button.send:disabled { background: #6c757d; cursor: not-allowed; }
        button.send:hover:not(:disabled) { background: #218838; }

        .error, .success {
            display: none;
            text-align: center;
            font-size: 14px;
            padding: 10px;
            border-radius: 4px;
            margin-top: 5px;
        }
        .error { background: #f8d7da; color: #721c24; }
        .success { background: #d4edda; color: #155724; }

        /* Мобильная адаптация */
        @media (max-width: 480px) {
            .modal-content {
                width: 100%;
                height: 100%;
                max-height: 100vh;
                border-radius: 0;
                padding: 15px;
            }
            h2 { margin-top: 10px; }
        }
    </style>
</head>
<body>

    <video width="640" height="360" controls>
        <source src="vidosik.mp4" type="video/mp4">
        Ваш браузер не поддерживает элемент video.
    </video>

    <button id="open-modal">Открыть форму обратной связи</button>

    <div class="modal" id="modal">
        <div class="modal-content">
            <span class="close-btn" id="close-modal">✖</span>
            <h2>Обратная связь</h2>
            <form id="feedback-form">
                <input name="FIO" type="text" id="name" placeholder="ФИО *" required>
                <input name="email" type="email" id="email" placeholder="Email *" required>
                <input name="tel" type="tel" id="phone" placeholder="Телефон *" required>
                <input name="organization" type="text" id="organization" placeholder="Организация *" required>
                <textarea name="message" id="message" placeholder="Сообщение о просмотренном видео *" required></textarea>
                
                <label>
                    <input name="checkbox" type="checkbox" id="consent" required>
                    Согласен с политикой обработки персональных данных *
                </label>
                
                <button class="send" type="submit">Отправить</button>
                
                <div class="error" id="error-message">Произошла ошибка. Попробуйте снова.</div>
                <div class="success" id="success-message">Ваше сообщение отправлено!</div>
            </form>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            'use strict';

            var modal = document.getElementById('modal');
            var openBtn = document.getElementById('open-modal');
            var closeBtn = document.getElementById('close-modal');
            var form = document.getElementById('feedback-form');
            
            var errorMsg = document.getElementById('error-message');
            var successMsg = document.getElementById('success-message');
            var submitBtn = form.querySelector('button[type="submit"]');

            // Ваша ссылка Formcarry
            var FORMCARRY_ENDPOINT = 'https://formcarry.com/s/ULQhHYsJoze';
            var STORAGE_KEY = 'feedback_form_data';

            var fields = ['name', 'email', 'phone', 'organization', 'message'];

            // --- Открытие и закрытие модального окна ---
            function openModal() {
                modal.classList.add('active');
                if (window.location.hash !== '#contact') {
                    history.pushState({ modal: 'contact' }, '', '#contact');
                }
                restoreFormData();
            }

            function closeModal() {
                modal.classList.remove('active');
                errorMsg.style.display = 'none';
                successMsg.style.display = 'none';
                if (window.location.hash === '#contact') {
                    history.back();
                }
            }

            openBtn.addEventListener('click', openModal);
            closeBtn.addEventListener('click', closeModal);

            // Закрытие при клике на фон
            window.addEventListener('click', function(e) {
                if (e.target === modal) {
                    closeModal();
                }
            });

            // Работа с History API (кнопка "Назад")
            window.addEventListener('popstate', function() {
                if (window.location.hash === '#contact') {
                    openModal();
                } else {
                    modal.classList.remove('active');
                }
            });

            if (window.location.hash === '#contact') {
                setTimeout(openModal, 0);
            }

            // --- LocalStorage (сохранение и восстановление) ---
            function saveFormData() {
                var data = {};
                fields.forEach(function(id) {
                    var el = document.getElementById(id);
                    if (el) { data[id] = el.value; }
                });
                var consent = document.getElementById('consent');
                if (consent) { data.consent = consent.checked; }
                
                localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
            }

            function restoreFormData() {
                var saved = localStorage.getItem(STORAGE_KEY);
                if (!saved) { return; }
                
                try {
                    var data = JSON.parse(saved);
                    fields.forEach(function(id) {
                        var el = document.getElementById(id);
                        if (el && data[id] !== undefined) { el.value = data[id]; }
                    });
                    var consent = document.getElementById('consent');
                    if (consent && data.consent !== undefined) { consent.checked = data.consent; }
                } catch (e) {
                    console.warn('Ошибка восстановления данных', e);
                }
            }

            function clearFormData() {
                localStorage.removeItem(STORAGE_KEY);
                form.reset();
            }

            // Сохраняем данные при вводе
            fields.forEach(function(id) {
                var el = document.getElementById(id);
                if (el) { el.addEventListener('input', saveFormData); }
            });
            document.getElementById('consent').addEventListener('change', saveFormData);

            // --- Фильтрация ввода ---
            // В ФИО только буквы, пробел и дефис
            document.getElementById('name').addEventListener('input', function() {
                this.value = this.value.replace(/[^a-zA-Zа-яА-ЯёЁ\s\-]/g, '');
            });

            // В Телефон только цифры, пробел, плюс, скобки и дефис
            document.getElementById('phone').addEventListener('input', function() {
                this.value = this.value.replace(/[^\d\s\+\-\(\)]/g, '');
            });

            // --- Отправка формы ---
            form.addEventListener('submit', function(e) {
                e.preventDefault();
                
                errorMsg.style.display = 'none';
                successMsg.style.display = 'none';
                submitBtn.disabled = true;
                submitBtn.textContent = 'Отправка...';

                var formData = {
                    FIO: document.getElementById('name').value.trim(),
                    email: document.getElementById('email').value.trim(),
                    tel: document.getElementById('phone').value.trim(),
                    organization: document.getElementById('organization').value.trim(),
                    message: document.getElementById('message').value.trim(),
                    checkbox: document.getElementById('consent').checked
                };

                fetch(FORMCARRY_ENDPOINT, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify(formData)
                })
                .then(function(response) {
                    if (response.ok) {
                        return response.json();
                    }
                    throw new Error('Ошибка сети или сервера');
                })
                .then(function(data) {
                    if (data.code === 200 || data.status === 'success') {
                        successMsg.style.display = 'block';
                        clearFormData();
                    } else {
                        throw new Error(data.message || 'Ошибка сервера');
                    }
                })
                .catch(function(error) {
                    console.error('Ошибка:', error);
                    errorMsg.style.display = 'block';
                    errorMsg.textContent = 'Ошибка отправки. Попробуйте снова.';
                })
                .finally(function() {
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Отправить';
                });
            });
        });
    </script>
</body>
</html>
