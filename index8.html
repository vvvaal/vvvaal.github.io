<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Обратная связь</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #f4f4f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .open-btn {
            padding: 15px 30px;
            font-size: 18px;
            background: #007bff;
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: background 0.2s;
        }
        .open-btn:hover { background: #0056b3; }

        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 10px;
        }
        .overlay.active { display: flex; }

        .modal {
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            position: relative;
            max-height: 100vh;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .close-btn {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 28px;
            background: none;
            border: none;
            cursor: pointer;
            color: #666;
            line-height: 1;
        }
        .close-btn:hover { color: #000; }

        h2 {
            margin-bottom: 15px;
            font-size: 20px;
            text-align: center;
            padding-right: 20px;
        }

        .form-group { margin-bottom: 12px; }

        .form-group label {
            display: block;
            margin-bottom: 4px;
            font-size: 14px;
            font-weight: 500;
        }

        .form-group input[type="text"],
        .form-group input[type="email"],
        .form-group input[type="tel"],
        .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        .checkbox-group {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            margin-bottom: 15px;
            font-size: 12px;
            line-height: 1.4;
        }

        .checkbox-group input {
            margin-top: 2px;
            width: 16px;
            height: 16px;
            flex-shrink: 0;
        }

        .submit-btn {
            width: 100%;
            padding: 12px;
            background: #28a745;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .submit-btn:disabled { background: #6c757d; cursor: not-allowed; }
        .submit-btn:hover:not(:disabled) { background: #218838; }

        .message {
            margin-top: 10px;
            text-align: center;
            font-size: 14px;
            padding: 8px;
            border-radius: 4px;
            display: none;
        }
        .message.success { display: block; background: #d4edda; color: #155724; }
        .message.error { display: block; background: #f8d7da; color: #721c24; }

        @media (max-width: 480px) {
            .modal {
                width: 100%;
                height: 100%;
                max-height: 100vh;
                border-radius: 0;
                padding: 15px;
            }
            h2 { margin-top: 10px; }
        }
    </style>
</head>
<body>

    <button class="open-btn" id="openBtn">Связаться с нами</button>

    <div class="overlay" id="overlay">
        <div class="modal">
            <button class="close-btn" id="closeBtn" aria-label="Закрыть">&times;</button>
            <h2>Форма обратной связи</h2>

            <form id="feedbackForm" novalidate>
                <div class="form-group">
                    <label for="fullname">ФИО *</label>
                    <input type="text" id="fullname" name="fullname" required placeholder="Иванов Иван Иванович">
                </div>

                <div class="form-group">
                    <label for="email">Email *</label>
                    <input type="email" id="email" name="email" required placeholder="example@mail.ru">
                </div>

                <div class="form-group">
                    <label for="phone">Телефон</label>
                    <input type="tel" id="phone" name="phone" placeholder="+7 (999) 123-45-67">
                </div>

                <div class="form-group">
                    <label for="organization">Организация</label>
                    <input type="text" id="organization" name="organization" placeholder="Название компании">
                </div>

                <div class="form-group">
                    <label for="message">Сообщение *</label>
                    <textarea id="message" name="message" required placeholder="Ваше сообщение..."></textarea>
                </div>

                <div class="checkbox-group">
                    <input type="checkbox" id="consent" name="consent" required>
                    <label for="consent">Я согласен с политикой обработки персональных данных *</label>
                </div>

                <button type="submit" class="submit-btn" id="submitBtn">Отправить</button>
                <div class="message" id="formMessage"></div>
            </form>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            // ВАЖНО: замените YOUR_FORM_ID на ID вашей формы с formcarry.com
            var FORMCARRY_ENDPOINT = 'https://formcarry.com/s/YOUR_FORM_ID';
            var STORAGE_KEY = 'feedback_form_data';

            var openBtn = document.getElementById('openBtn');
            var closeBtn = document.getElementById('closeBtn');
            var overlay = document.getElementById('overlay');
            var form = document.getElementById('feedbackForm');
            var submitBtn = document.getElementById('submitBtn');
            var messageDiv = document.getElementById('formMessage');

            var fields = ['fullname', 'email', 'phone', 'organization', 'message'];
            var fullnameInput = document.getElementById('fullname');
            var phoneInput = document.getElementById('phone');

            // Фильтрация ввода для ФИО (только буквы, пробел и дефис)
            fullnameInput.addEventListener('input', function() {
                this.value = this.value.replace(/[^a-zA-Zа-яА-ЯёЁ\s\-]/g, '');
            });

            // Фильтрация ввода для Телефона (только цифры, пробел, плюс, скобки и дефис)
            phoneInput.addEventListener('input', function() {
                this.value = this.value.replace(/[^\d\s\+\-\(\)]/g, '');
            });

            function openModal() {
                overlay.classList.add('active');
                if (window.location.hash !== '#contact') {
                    history.pushState({ modal: 'contact' }, '', '#contact');
                }
                restoreFormData();
            }

            function closeModal() {
                overlay.classList.remove('active');
                clearMessage();
                if (window.location.hash === '#contact') {
                    history.back();
                }
            }

            window.addEventListener('popstate', function() {
                if (window.location.hash === '#contact') {
                    openModal();
                } else {
                    overlay.classList.remove('active');
                }
            });

            if (window.location.hash === '#contact') {
                setTimeout(openModal, 0);
            }

            function saveFormData() {
                var data = {};
                fields.forEach(function(id) {
                    var el = document.getElementById(id);
                    if (el) { data[id] = el.value; }
                });
                var consent = document.getElementById('consent');
                if (consent) { data.consent = consent.checked; }
                localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
            }

            function restoreFormData() {
                var saved = localStorage.getItem(STORAGE_KEY);
                if (!saved) { return; }
                try {
                    var data = JSON.parse(saved);
                    fields.forEach(function(id) {
                        var el = document.getElementById(id);
                        if (el && data[id] !== undefined) { el.value = data[id]; }
                    });
                    var consent = document.getElementById('consent');
                    if (consent && data.consent !== undefined) { consent.checked = data.consent; }
                } catch (e) {
                    console.warn('Ошибка восстановления данных', e);
                }
            }

            function clearFormData() {
                localStorage.removeItem(STORAGE_KEY);
                form.reset();
            }

            function showMessage(text, type) {
                messageDiv.textContent = text;
                messageDiv.className = 'message ' + type;
            }

            function clearMessage() {
                messageDiv.textContent = '';
                messageDiv.className = 'message';
            }

            form.addEventListener('submit', function(e) {
                e.preventDefault();

                if (!form.checkValidity()) {
                    form.reportValidity();
                    return;
                }

                submitBtn.disabled = true;
                submitBtn.textContent = 'Отправка...';
                clearMessage();

                var formData = {
                    fullname: document.getElementById('fullname').value.trim(),
                    email: document.getElementById('email').value.trim(),
                    phone: document.getElementById('phone').value.trim(),
                    organization: document.getElementById('organization').value.trim(),
                    message: document.getElementById('message').value.trim(),
                    consent: document.getElementById('consent').checked
                };

                fetch(FORMCARRY_ENDPOINT, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify(formData)
                })
                .then(function(response) {
                    return response.json().then(function(result) {
                        return { ok: response.ok, result: result };
                    });
                })
                .then(function(data) {
                    if (data.ok && data.result.code === 200) {
                        showMessage('Сообщение успешно отправлено!', 'success');
                        clearFormData();
                    } else {
                        throw new Error(data.result.message || 'Ошибка сервера');
                    }
                })
                .catch(function(error) {
                    console.error('Ошибка отправки:', error);
                    showMessage('Ошибка отправки: ' + error.message, 'error');
                })
                .finally(function() {
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Отправить';
                });
            });

            fields.forEach(function(id) {
                var el = document.getElementById(id);
                if (el) { el.addEventListener('input', saveFormData); }
            });
            document.getElementById('consent').addEventListener('change', saveFormData);

            openBtn.addEventListener('click', openModal);
            closeBtn.addEventListener('click', closeModal);
            overlay.addEventListener('click', function(e) {
                if (e.target === overlay) { closeModal(); }
            });
        })();
    </script>
</body>
</html>
